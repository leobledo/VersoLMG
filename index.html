    if(!f1.length){ next([]); return; }
    gStatus('Retrying '+f1.length+'…', 'var(--bl)');
    setTimeout(function(){ if(!live()) return; f1.forEach(function(j){ j.err=''; }); pass(f1, 1, function(f2){ settled+=f2.length; paint(); next(f2); }); }, 1500);
  }
  function upgrade(next){   // LRCLIB → Genius, uno por uno (solo si hay una via a Genius: AE o extension)
    var lst=jobs.filter(function(j){ return j.done && j.src==='lrclib'; });
    if(!lst.length || !(IN_AE || _gExt===true)){ next(); return; }
    var i=0;
    (function step(){
      if(!live()) return;
      if(i>=lst.length){ next(); return; }
      var j=lst[i++]; gStatus('Genius [secciones] '+i+'/'+lst.length+' · '+j.ch.name+'…', 'var(--bl)');
      setTimeout(function(){
        if(!live()) return;

    var parts=[];
    if(failed.length) parts.push('✗ '+failed.map(function(j){ return j.ch.name+': '+j.err; }).join(' · '));
    if(lrc.length) parts.push('LRCLIB (sin [secciones]): '+lrc.map(function(j){ return j.ch.name+(j.why?(' ('+j.why+')'):''); }).join(' · '));
    if(hint && (failed.length || lrc.length)) parts.push('⚠ '+hint);

      // Deja la seccion de links abierta con el detalle: "Load" reintenta (lo ya cargado de Genius sale de cache).
      var gb=document.getElementById('dpGlobalBar'); if(gb && !gb.classList.contains('genius-open')) toggleGeniusBulk();

}
// Discreet progress message for the import (small line — popup status / toast).
function _geniusProgMsg(p){

// ─── GENIUS FETCH ENGINE ───
// UNA peticion = UN link. Nada se comparte entre peticiones (en AE cada descarga con curl
// usa su PROPIO archivo temporal) y cada resultado se verifica contra la URL canonica de
// su link → cada canal recibe SIEMPRE la letra de SU link, en el orden de los links.
// Rutas (gana la primera letra verificada):
//  · embed  — genius.com/songs/<id>/embed.js: CORS abierto (*), ~6 KB, trae las [Secciones].
//             El <id> sale de la API de busqueda (match EXACTO del link) y queda en cache.
//  · pagina — HTML de Genius: directo en AE; via proxies CORS en web (los proxies gratis
//             fallan seguido — ya no son la unica via, y se piden datos chicos primero).
//  · curl   — solo AE: curl del sistema, en cola (uno a la vez), archivo temporal unico.
//  · ext    — solo web: la extension de Chrome "Content Controler" lee la pestaña de Genius
//             ya abierta con ese link (instantaneo) o descarga la pagina sin CORS. Es la via
//             confiable en web: hoy (oct-2026) ningun proxy CORS gratis responde.
//  · LRCLIB — ultimo recurso (sin [Secciones]) y solo si coincide artista+titulo del link.
//             Se pide EN PARALELO desde el inicio y solo se usa si Genius falla → no suma espera.
// Proxies caidos se descartan al primer fallo; el reintento solo repite las vias no-proxy.
// OPCIONAL / EXPERIMENTAL: token de la API oficial de Genius (https://genius.com/api-clients →
// "Generate Access Token"; o localStorage.setItem('verso_genius_token','<token>')). OJO: la API
// oficial no esta documentada para llamadas desde el navegador (CORS) y no se pudo probar con
// un token real. La via confiable en web es la extension Content Controler v2. Sin token: se salta.

  { n:'allorigins-json', w:function(u){ return 'https://api.allorigins.win/get?url='+encodeURIComponent(u); }, json:true }

// Salud de cada proxy (no perder tiempo en uno caido): sin exito previo en la sesion, 1 falla
// = 2 min fuera (hoy casi todos estan caidos); si ya respondio antes, 2 fallas seguidas.
// 400/401/403 = pide cuenta, API key u origen registrado → 10 min fuera.
var _gHealth={};
function _gUp(n){ var h=_gHealth[n], now=Date.now(); return !h || (now>=h.dead && now>=h.until); }
function _gMark(n, ok, err){

  if(ok){ h.fail=0; h.until=0; h.dead=0; h.ever=true; return; }
  if(/^HTTP 40[013]$/.test(err||'')){ h.dead=Date.now()+600000; return; }

// "https://www.Genius.com/Bad-bunny-dtmf-lyrics?x#y" → "genius.com/bad-bunny-dtmf-lyrics"
function _gNorm(u){
  u=String(u||'').trim(); try{ u=decodeURIComponent(u); }catch(e){}
  return u.replace(/^[a-z]+:\/\//i,'').replace(/^(?:www|m)\./i,'').replace(/[?#].*$/,'').replace(/\/amp\//i,'/').replace(/\/+$/,'').toLowerCase();
}

// El link dentro de lo pegado ("1. Artista - Cancion https://genius.com/…" → solo la URL).
function _gLinkOf(s){ s=String(s||'').trim(); var m=s.match(/https?:\/\/[^\s"'<>]+/i); return m?m[0]:s; }

// 'ok' = es la pagina del link · 'redirect' = Genius redirigio el link a su slug actual ·

// embed.js = document.write(JSON.parse('<HTML del embed como literal JS>')) → {lyr, canon}
function _gUnescapeJS(s){
  return String(s).replace(/\\(u[0-9a-fA-F]{4}|x[0-9a-fA-F]{2}|[\s\S])/g, function(m, c){
    if(c.length>1) return String.fromCharCode(parseInt(c.slice(1),16));
    return c==='n'?'\n':c==='r'?'\r':c==='t'?'\t':c==='b'?'\b':c==='f'?'\f':c==='v'?'\v':c==='0'?'\0':(c==='\n'||c==='\r')?'':c;

// AE: descarga la pagina con el curl del SISTEMA (via host.jsx) — TLS real + UA de navegador,
// inmune a CORS/Cloudflare del CEF. UNA descarga a la vez y cada una a SU archivo temporal:
// antes todas escribian verso_genius.html y, en Mac, los callbacks de evalScript llegaban
// cuando la cola ya habia terminado → todos los canales leian el ultimo archivo (misma letra).
var _gCurlQ=[], _gCurlBusy=false, _gCurlHostAt=0, _gCurlSeq=0;

    // 1. Modern Genius: data-lyrics-container
    var nodes=doc.querySelectorAll('[data-lyrics-container="true"]');
    if(!nodes.length) nodes=doc.querySelectorAll('[class*="Lyrics__Container"]');
    if(!nodes.length) nodes=doc.querySelectorAll('.lyrics');
    if(nodes && nodes.length){
      var parts=[]; for(var i=0;i<nodes.length;i++) parts.push(_geniusNodeText(nodes[i]));
      var t=_cleanGeniusText(parts.join('\n')); if(t) return t;
    }

    // 2. JSON-LD schema (schema.org MusicRecording)
    var ldEl=doc.querySelector('script[type="application/ld+json"]');
    if(ldEl){ try{ var ld=JSON.parse(ldEl.textContent||'{}'); if(ld.lyrics&&ld.lyrics.text){ var lt=_cleanGeniusText(ld.lyrics.text); if(lt) return lt; } }catch(e){} }

    // 3. Inertia / SSR JSON embedded in <div id="app" data-page="...">
    var appEl=doc.querySelector('#app[data-page]');
    if(appEl){ try{
      var pg=JSON.parse(appEl.getAttribute('data-page')||'{}');
      var lyrObj=pg&&pg.props&&pg.props.song&&pg.props.song.lyrics_state;
      if(lyrObj&&lyrObj.body&&lyrObj.body.plain){ var pt=_cleanGeniusText(lyrObj.body.plain); if(pt) return pt; }
    }catch(e){} }

    // 4. Regex fallback: lyrics_body in JSON script
    var sm=html.match(/"lyrics_body"\s*:\s*"((?:[^"\\]|\\.)*)"/);
    if(sm){ try{ var rb=JSON.parse('"'+sm[1]+'"'); var ct=_cleanGeniusText(rb); if(ct) return ct; }catch(e){} }

    return null;
  }catch(e){ return null; }
}

// ─── UTILS ───
function fmtClock(s){ s=Math.max(0,s||0); var m=Math.floor(s/60),sec=Math.floor(s%60); return p2(m)+':'+p2(sec); }
function fmtTimer(s){ s=Math.max(0,s||0); var m=Math.floor(s/60),sec=Math.floor(s%60),cs=Math.floor((s%1)*100); return p2(m)+':'+p2(sec)+':'+p2(cs); }
function fmtTip(s){ s=Math.max(0,s||0); var m=Math.floor(s/60),sec=Math.floor(s%60),cs=Math.floor((s%1)*100); return p2(m)+':'+p2(sec)+'.'+p2(cs); }
function toSRT(s){ var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=Math.floor(s%60),ms=Math.floor((s%1)*1000); return p2(h)+':'+p2(m)+':'+p2(sec)+','+p3(ms); }
function p2(n){ return String(Math.floor(n)).padStart(2,'0'); }
function p3(n){ return String(n).padStart(3,'0'); }
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// Inside AE the update legends appear in the small status line under the timer.
// On the web they use the floating toast.
// Legends always show in the status line ABOVE the timer (web too, like AE), never the
// bottom toast that overlapped the timeline. Falls back to #toast only if the bar isn't built yet.
// Static base legend: which channel I'm working on. Stays fixed while no toast is showing.
var _legendBase='';
function _showBase(st){ st._tmp=false; st.textContent=_legendBase; st.classList.toggle('base', !!_legendBase); st.classList.toggle('on', !!_legendBase); }
function setLegend(msg){ _legendBase=(msg||'').trim(); var c=document.getElementById('tChannel'); if(c) c.textContent=_legendBase; }
function toast(msg,ms){
  var st=document.getElementById('tStatus');
  if(st){ st.textContent=msg; st.classList.add('on'); clearTimeout(st._t); st._t=setTimeout(function(){ st.classList.remove('on'); st.textContent=''; }, ms||4000); return; }
  var t=document.getElementById('toast'); if(t){ t.textContent=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(function(){ t.classList.remove('on'); },ms||2200); }
}
</script>
